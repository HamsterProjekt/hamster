name: Testing
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # This runs the test suite. Since we need some system dependencies
    # (e.g. pygobject) that cannot easily be installed inside a
    # virtualenv using pip, this just runs with the Ubuntu system python
    # (e.g. not using the standard setup-python action, which sets up a
    # virtualenv).
    name: Run test suite
    strategy:
      # Complete all combinations, even if one fails
      fail-fast: false
      matrix:
        # The oldest Ubuntu that GitHub still offers, to stay close to the
        # minimum required Python version, and the latest one.
        os: [ubuntu-22.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Prepare repo
        uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext intltool python3 python3-gi python3-cairo python3-gi-cairo python3-dbus python3-xdg libglib2.0-dev libglib2.0-bin gir1.2-gtk-3.0 gtk-update-icon-cache dbus-x11
      - name: Install hamster
        # This serves two purposes:
        #  1) Verify build and install still works and
        #  2) install the needed stuff (e.g. gsettings schemas) to allow
        #     running the tests
        run: |
          python3 ./waf configure build
          sudo python3 ./waf install
      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: |
          dbus-launch python3 -m unittest
      - name: Run tests with coverage
        # One run measures coverage, for SonarQube Cloud.
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y python3-coverage
          dbus-launch python3 -m coverage run --source=src -m unittest
          python3 -m coverage xml -o coverage.xml
      - name: Upload the coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  sonarcloud:
    # Analyses the code on SonarQube Cloud, with the coverage of the tests.
    # Skipped without the SONAR_TOKEN secret, as in pull requests from forks.
    name: SonarQube Cloud analysis
    needs: test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Prepare repo
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          # full history, so that new code and blame are right
          fetch-depth: 0
      - name: Download the coverage report
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: coverage
      - name: Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65  # v8.4.1

  flake8:
    name: Run code linting and checks
    runs-on: ubuntu-latest
    steps:
      - name: Prepare repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install flake8
        run: |
          pip install flake8
      - name: Run flake8
        run: |
          flake8 --count --show-source --statistics
