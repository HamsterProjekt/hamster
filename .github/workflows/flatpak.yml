# Builds the Flatpak (flatpak/build.sh) and runs the tests inside it.
# Pull requests get the bundle as a build artifact; every merge to main
# also publishes it as a new release, so that the latest one is always at
# https://github.com/HamsterProjekt/hamster/releases/latest/download/hamster.flatpak
# and pushes it to GitHub Packages as ghcr.io/hamsterprojekt/hamster-flatpak
# (tags: latest and the release's version).
name: Flatpak
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: Build the Flatpak
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # to publish the release
      packages: write   # to push the bundle to ghcr.io
    env:
      FLATPAK_WORK: ${{ github.workspace }}/../flatpak-work
    steps:
      - name: Prepare repo
        uses: actions/checkout@v7
        with:
          # the version shown in the about dialog comes from git describe
          fetch-depth: 0
      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder dbus
      - name: Cache the downloads of flatpak-builder
        uses: actions/cache@v6
        with:
          path: ${{ env.FLATPAK_WORK }}/state
          key: flatpak-state-${{ hashFiles('flatpak/*.yml') }}
          restore-keys: flatpak-state-
      - name: Set the version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        # tagged here so that `git describe` in the build gives the release's
        # version; `gh release create` below pushes the same tag
        run: |
          version="$(date -u +%Y.%m.%d).${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_ENV"
          git tag "flatpak-$version"
      - name: Build, test and bundle
        run: flatpak/build.sh --no-install --test --bundle
      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: hamster-flatpak
          path: hamster.flatpak
      - name: Publish a release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "flatpak-$version" hamster.flatpak \
            --target "$GITHUB_SHA" --latest \
            --title "Hamster $version (Flatpak)" \
            --notes "Flatpak of HamsterProjekt's Hamster, built from $GITHUB_SHA.

          Install it for your user with:

              flatpak install --user hamster.flatpak

          The runtime comes from Flathub."
      - name: Install oras
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63  # v2.0.3
      - name: Push the bundle to GitHub Packages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push "ghcr.io/hamsterprojekt/hamster-flatpak:$version,latest" \
            --artifact-type application/vnd.flatpak.bundle \
            --annotation "org.opencontainers.image.source=https://github.com/HamsterProjekt/hamster" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.version=$version" \
            --annotation "org.opencontainers.image.licenses=GPL-3.0-or-later" \
            hamster.flatpak:application/vnd.flatpak.bundle
