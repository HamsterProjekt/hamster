# Flatpak of Hamster: the service (SQLite storage by default) and its GTK
# windows, built from this checkout.
#
# Build and install for your user:   flatpak/build.sh
# On every merge to main, .github/workflows/flatpak.yml builds it and
# publishes the bundle as a release.
app-id: io.github.HamsterProjekt.Hamster
# the branch Flatpak installs it on (flatpak's default would be "master")
branch: stable
runtime: org.gnome.Platform
runtime-version: '45'
sdk: org.gnome.Sdk
command: hamster
modules:
- name: intltool
  sources:
  - type: archive
    url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
    md5: 12e517cac2b57a0121cda351570f1e63
  cleanup:
  - "*"
- name: python3-hamster-dependencies
  buildsystem: simple
  ensure-writable:
  - easy-install.pth
  - setuptools.pth
  build-commands:
  - pip3 install --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
    dbus-python
  sources:
  - type: file
    url: https://dbus.freedesktop.org/releases/dbus-python/dbus-python-1.2.18.tar.gz
    sha256: 92bdd1e68b45596c833307a5ff4b217ee6929a1502f5341bae28fd120acf7260
- name: hamster
  buildsystem: simple
  builddir: true
  prefix: "/app"
  build-commands:
  - "./waf configure --prefix=${FLATPAK_DEST}"
  - "./waf build"
  - "./waf install"
  sources:
  # this checkout (the manifest is in flatpak/), with its .git so that
  # the version comes from `git describe` (see src/hamster/version.py)
  # rather than from the "unreleased" in src/hamster/VERSION
  - type: dir
    path: ".."
    skip:
    - build
    - .waf3-*
    - .flatpak-builder
    - hamster.flatpak
finish-args:
- "--socket=wayland"
- "--socket=fallback-x11"
- "--filesystem=xdg-documents"
- "--own-name=io.github.HamsterProjekt.Hamster"
- "--own-name=io.github.HamsterProjekt.Hamster.GUI"
- "--own-name=io.github.HamsterProjekt.Hamster.WindowServer"
