# SonarQube Cloud analysis, run by .github/workflows/testing.yml
sonar.projectKey=HamsterProjekt_hamster
sonar.organization=hamsterprojekt
sonar.projectName=hamster

# SonarQube Cloud analyses the whole repository; sonar.sources and
# sonar.tests have no effect. Leave out the bundled waf build tool.
sonar.exclusions=waf,waflib/**,**/__pycache__/**
# The scripts that start the service and the app need a desktop session,
# so the unit tests don't run them; leave them out of the coverage.
sonar.coverage.exclusions=src/hamster-*.py

sonar.python.version=3.10,3.11,3.12
sonar.python.coverage.reportPaths=coverage.xml
